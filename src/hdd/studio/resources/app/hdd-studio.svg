  <rect x="112" y="112" width="48" height="48" fill="#D6E5F3"/>
  <rect x="160" y="160" width="64" height="64" fill="#ADC9E6"/>
  <g fill="#7FA9D3">
    <rect x="130" y="50" width="12" height="12" rx="3"/>
    <rect x="50" y="130" width="12" height="12" rx="3"/>
    <rect x="194" y="82" width="12" height="12" rx="3"/>
    <rect x="82" y="194" width="12" height="12" rx="3"/>
    <rect x="194" y="146" width="12" height="12" rx="3"/>
    <rect x="146" y="194" width="12" height="12" rx="3"/>
  </g>
</svg>
