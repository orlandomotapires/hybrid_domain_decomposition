    <rect x="152" y="152" width="56" height="56" rx="3" opacity="0.76"/>
  </g>
  <g fill="#9EC5F4">
    <rect x="116" y="56" width="10" height="10" rx="2"/>
    <rect x="164" y="72" width="10" height="10" rx="2"/>
    <rect x="60" y="120" width="10" height="10" rx="2"/>
