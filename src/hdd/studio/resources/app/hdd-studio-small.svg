  <rect x="32" y="32" width="192" height="192" rx="6" fill="#24527A"/>
  <rect x="32" y="32" width="80" height="80" fill="#FFFFFF"/>
  <rect x="112" y="112" width="48" height="48" fill="#D6E5F3"/>
  <rect x="160" y="160" width="64" height="64" fill="#ADC9E6"/>
</svg>
