name: CI

on:
  push:
    branches: [main]
  pull_request:

# The token only needs to read the repository.
permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ruff
        run: |
          python -m pip install "ruff==0.17.6"
          ruff check src tests docs

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported version (pyproject: requires-python >=3.10), the main one, and the newest.
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt
      - name: Install system libraries for headless Qt
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install package
        # constraints.txt pins exact versions from Python 3.12 on; 3.10 uses the pyproject floors.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints.txt -e ".[gui,dev]"
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          if [ "${{ matrix.python-version }}" = "3.12" ]; then
            python -m pytest tests --cov --cov-report=term-missing:skip-covered
          else
            python -m pytest tests
          fi
