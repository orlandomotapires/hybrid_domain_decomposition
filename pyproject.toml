[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-domain-decomposition"
version = "0.1.0"
description = "Hybrid graph partitioning and FEM matrix permutation workflows for thesis experiments"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
  "numpy",
  "scipy",
  "networkx",
  "pymetis",
  "pennylane",
  "dwave-neal",
  "dwave-system",
  "matplotlib",
  "fastapi",
  "uvicorn[standard]",
  "python-multipart",
]

[project.scripts]
hdd-run = "main:cli_main"
hdd-qlm-inspect = "libs.multilevel_scheme.partitioning.qaoa.qlm_inspect:cli_main"
hdd-studio = "api.app:cli_main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["libs*"]
namespaces = true