[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-domain-decomposition"
version = "1.0.0"
description = "Hybrid quantum-classical graph partitioning and sparse matrix permutation, with a desktop studio"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
  "numpy",
  "scipy",
  "networkx",
  "pymetis",
  "pennylane",
  "dwave-neal",
  "dwave-system",
  "matplotlib",
  "optuna>=5.0",
]

[project.optional-dependencies]
# Desktop application (HDD Studio Desktop). Floors are the versions it was built and tested with.
gui = [
  "PySide6-Essentials>=6.12",
  "pyqtgraph>=0.14",
]
dev = [
  "pytest>=9",
  "pytest-qt>=4.5",
  "pytest-timeout>=2.3",
  "pytest-cov>=5",
  "ruff>=0.6",
]

[project.scripts]
hdd-run = "main:cli_main"
hdd-tune = "libs.tuning.cli:main"
hdd-qlm-inspect = "libs.multilevel_scheme.partitioning.qaoa.qlm_inspect:cli_main"

[project.gui-scripts]
hdd-studio = "hdd.studio.app:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["libs*", "hdd*"]
namespaces = true

[tool.setuptools.package-data]
"hdd.studio" = ["resources/**/*"]
"hdd.services" = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
# A hung test (a child process, a Qt event loop) fails after 5 minutes instead of blocking CI.
timeout = 300

[tool.coverage.run]
source = ["src/libs", "src/hdd/services"]

[tool.ruff]
target-version = "py310"  # also flags syntax newer than the oldest supported Python
line-length = 140
extend-exclude = ["notebooks"]

[tool.ruff.lint]
# Errors and likely bugs, plus pyupgrade so syntax newer than target-version is flagged.
select = ["E4", "E7", "E9", "F", "B006", "UP"]
# Style-only upgrades: keep the existing typing and formatting style.
ignore = ["UP006", "UP007", "UP031", "UP034", "UP035", "UP037", "UP045"]
